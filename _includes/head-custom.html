<!-- the site follows the system dark mode, with GitHub's dark colors -->
<meta name="color-scheme" content="light dark">
<style>
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background-color: #0d1117; }
    a { color: #4493f8; }
    .markdown-body h1, .markdown-body h2 { border-bottom-color: #30363d; }
    .markdown-body h6, .markdown-body blockquote { color: #9198a1; }
    .markdown-body blockquote { border-left-color: #30363d; }
    .markdown-body hr { background-color: #30363d; }
    .markdown-body table th, .markdown-body table td { border-color: #30363d; }
    .markdown-body table tr { background-color: #0d1117; border-top-color: #30363d; }
    .markdown-body table tr:nth-child(2n) { background-color: #151b23; }
    .markdown-body img { background-color: transparent; }
    .markdown-body code, .markdown-body tt { background-color: rgba(101, 108, 118, 0.2); }
    .markdown-body pre, .markdown-body .highlight pre { background-color: #151b23; }
    .markdown-body kbd { color: #e6edf3; background-color: #151b23; border-color: #3d444d; box-shadow: inset 0 -1px 0 #3d444d; }
  }
</style>
