    <script type="text/javascript">
function getHeight() {
    return Math.max(window.innerHeight / 2 - 200, 200);
}
function getSize() {
    return {
	width: window.innerWidth - getDistSize().width,
	height: getHeight(),
    }
}
// on narrow screens the distribution charts drop their value labels, the
// main chart next to them already shows the same scale
function isNarrow() {
    return window.innerWidth < 600;
}
function getDistTitle() {
    return isNarrow() ? "Dist." : "Distribution";
}
// the distribution charts take 20% of the total width
function getDistSize() {
    return {
	width: Math.floor(window.innerWidth * 0.2),
	height: getHeight(),
    }
}

function formatNumber(num, width) {
    var ret = "" + num;
    while (ret.length < width) {
	ret = "0" + ret;
    }
    return ret;
}
function format3(num, postfix = "") {
    if (typeof num == "undefined" || num == null || Number.isNaN(num)) return "";
    if (num < 1) return "" + num.toFixed(3) + postfix;
    if (num < 10) return "" + num.toFixed(2) + postfix;
    if (num < 100) return "" + num.toFixed(1) + postfix;
    return "" + num.toFixed(0) + postfix;
}

function el(id) {
    return document.getElementById(id);
}

function debug(str) {
    if (!console) {
	return;
    }
    if (typeof str == "string") {
	var d = new Date();
	console.debug(
	    d.getFullYear() + "." +
		formatNumber(d.getMonth() + 1, 2) + "." +
		formatNumber(d.getDate(), 2) + " " +
		formatNumber(d.getHours(), 2) + ":" +
		formatNumber(d.getMinutes(), 2) + ":" +
		formatNumber(d.getSeconds(), 2) + "." +
		formatNumber(d.getMilliseconds(), 3) + ": " + str);
    }
    else {
	console.debug(str);
    }
}

// full gauge is 270 degrees, divided in 4 equal sections
// section 1: 0 - 1 Mbps, linear
// section 2,3,4: 1 - 1000 Mbps, logaritmic
function speed_to_gauge_degrees(mbps) {
    if (mbps < 1) {
	return mbps * (270 / 4);
    }
    var ret = Math.log10(mbps) + 1;
    if (ret > 4) {
	ret = 4;
    }
    return ret * (270 / 4);
}
function deg_to_rad(deg) {
    return deg * Math.PI / 180;
}
function degrees_to_clip_path(deg) {
    var ri = 50;
    var pi = Math.sqrt(ri * ri / 2).toFixed(2);
    var rad = deg_to_rad(deg);
    var cos = Math.cos(rad);
    var sin = Math.sin(rad);
    var pti = [-(cos * pi + sin * pi).toFixed(2), (cos * pi - sin * pi).toFixed(2)];

    var s = 0;
    if (deg >= 180) {
	s = 1;
    }

    ret = " l -" + pi + " " + pi;
    ret += " a " + ri + " " + ri + " 1 " + s + " 1 " + (pti[0] - -pi) + " " + (pti[1] - pi);
    ret += " z";
    return ret;
}

function request(obj, cb) {
//    debug("request");
    var req = new XMLHttpRequest();
    req.onreadystatechange = function() {
	if (req.readyState == 4) {
	    if (req.status == 200) {
		cb(req.responseText);
	    }
	    else {
		cb(null);
	    }
	    req = null;
        }
    };
    req.timeout = 60 * 1000;
    req.open("POST", "/status", true);
    req.send(obj);
}

var stateStr = "";
function dashboard_set() {
    if (!stateObj || !stateObj.state) {
	el("start_button").style.visibility = "hidden";
	el("stop_button").style.visibility = "hidden";
	el("disconnected_button").style.visibility = "visible";
	el("disconnected2_button").style.visibility = "visible";
	return;
    }
    el("disconnected_button").style.visibility = "hidden";
    el("disconnected2_button").style.visibility = "hidden";
    if (stateObj.state == "idle") {
	el("start_button").style.visibility = "visible";
	el("stop_button").style.visibility = "hidden";
    }
    else {
	el("start_button").style.visibility = "hidden";
	el("stop_button").style.visibility = "visible";
    }
    // anything missing from the state is shown as on a fresh page load, so
    // the gauges after a test look the same as after reloading the page
    el("idle_latency").textContent = stateObj.latency ? format3(stateObj.latency, "ms") : "";
    set_speed_gauge("download", 45, stateObj.download_mbps);
    set_progress_band("download", 45, stateObj.download_progress);
    el("download_latency").textContent = stateObj.download_latency ? format3(stateObj.download_latency, "ms") : "";
    set_speed_gauge("upload", 155, stateObj.upload_mbps);
    set_progress_band("upload", 155, stateObj.upload_progress);
    el("upload_latency").textContent = stateObj.upload_latency ? format3(stateObj.upload_latency, "ms") : "";
}

function set_speed_gauge(name, cx, mbps) {
    if (!mbps) {
	el(name + "_mbps").textContent = "";
	el(name + "_needle").style.visibility = "hidden";
	el(name + "_speed_band_clip_path").setAttribute("d", "");
	return;
    }
    el(name + "_mbps").textContent = format3(mbps);
    var deg = speed_to_gauge_degrees(mbps);
    el(name + "_needle").transform.baseVal[0].setRotate(-135 + deg, cx, 50);
    el(name + "_needle").style.visibility = "visible";
    el(name + "_speed_band_clip_path").setAttribute("d", "M" + cx + " 50" + degrees_to_clip_path(deg));
}

function set_progress_band(name, cx, progress) {
    el(name + "_progress_band_clip_path").setAttribute("d", progress ? "M" + cx + " 50" + degrees_to_clip_path(progress * 270 / 100) : "");
}

function onRequest(r) {
//    debug("on request " + r);
    if (r == null) {
	stateStr = "connection lost";
	stateObj = {};
	dashboard_set();
	setTimeout(function () { request(null, onRequest); }, 1000);
	return;
    }

    stateStr = r;
    stateNew = JSON.parse(r);
    if (stateObj.state != stateNew.state)  {
	debug("old:" + stateObj.state + " new:" + stateNew.state);
    }
    if (stateObj.state && stateObj.state != "idle" && stateNew.state == "idle") {
	// a test finished, show its result
	debug("refresh on idle");
	refreshResults();
    }
    stateOld = stateObj;
    stateObj = stateNew;
    if (stateObj.idle_time) {
	updateIdleTime();
    }
    else {
	cleanupIdleTime();
    }
    dashboard_set();
    setTimeout(function () { request(stateStr, onRequest); }, 100);
};

// fetches the results and updates the charts in place, keeping the mode, the
// zoom and the table sorting, falls back to reloading the page
function refreshResults() {
    fetch("data.json")
	.then(r => {
	    if (!r.ok) {
		throw new Error("status " + r.status);
	    }
	    return r.json();
	})
	.then(j => refreshData(j.data, j.info))
	.catch(e => {
	    debug("refresh failed, reloading: " + e);
	    window.location.reload();
	});
}
var refreshData = null;

var idleTimer = null;
function updateIdleTime() {
//    debug("updateIdleTime");
    if (idleTimer) {
	clearTimeout(idleTimer);
    }
    idleTimer = null;
    var el = document.getElementById("time_till_next");
    var it = stateObj.idle_time;
    if (!it || it < 0) {
	cleanupIdleTime();
	return;
    }
    el.textContent = formatNumber(Math.floor(it / 60), 2) + ":" + formatNumber(it % 60, 2);
    idleTimer = setTimeout(function() { stateObj.idle_time -= 1; updateIdleTime(); }, 1000);
}

function cleanupIdleTime() {
    var el = document.getElementById("time_till_next");
    el.textContent = "";
    if (idleTimer) {
	clearTimeout(idleTimer);
    }
}

function initSpeedKetchup() {
    var dark = false;
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
	dark = true;
    }
    dashboard_set();

    let mooSync = uPlot.sync("moo");
    const matchSyncKeys = (own, ext) => own == ext;

    const cursorOpts = {
	lock: true,
	sync: {
	    key: mooSync.key,
//	    setSeries: true,
	    match: [matchSyncKeys, matchSyncKeys],
	},
	y: false,
    };

    let axis = [
	{
	    stroke: dark ? "#fff" : "#000",
            grid: {
                show: true,
                stroke: "#8885",
                width: 1,
            },
	    ticks: {
                stroke: "#8885",
                width: 1,
	    },
	},
	{
	    stroke: dark ? "#fff" : "#000",
            grid: {
                show: true,
                stroke: "#8885",
                width: 1,
            },
	    ticks: {
                stroke: "#8885",
                width: 1,
	    },
	},
    ];
    let no_data = data[0].length == 0;
    function x_range(min, max) {
	let span = profile_span();
	if (span) {
	    // the whole day or week, unless zoomed in
	    if (d[0].length == 0 || (min == d[0][0] && max == d[0][d[0].length - 1])) {
		return [0, span];
	    }
	    return [min, max];
	}
	if (no_data) {
	    let now = Math.floor(Date.now() / 1000);
	    return [now - 3600, now];
	}
	return [min, max];
    }
    // the top of the latency y axis ignores this fraction of the highest
    // visible values, so a few extreme results don't squash the rest of the
    // chart, nothing is dropped until there are enough values to drop a whole one
    const latency_max_drop = 0.01;
    // the y axis always covers the raw results, even when averages are shown
    function y_range(u, min, max, raw, max_drop = 0) {
	if (no_data) {
	    return [0, 100];
	}
	// uplot only updates u.scales.x after all the ranges are computed, so the
	// new x range is kept by the x range function, which runs first
	let [minx, maxx] = u.x_view ?? [-Infinity, Infinity];
	let in_view = raw_in_view(minx, maxx);
	let vals = [];
	for (let s = 1; s < u.series.length; s++) {
	    if (!u.series[s].show) {
		continue;
	    }
	    for (let i = 0; i < raw[0].length; i++) {
		if (raw[s][i] != null && in_view(i)) {
		    vals.push(raw[s][i]);
		}
	    }
	}
	if (vals.length > 0) {
	    vals.sort((a, b) => a - b);
	    min = vals[0];
	    max = vals[vals.length - 1 - Math.floor(vals.length * max_drop)];
	}
	return uPlot.rangeNum(min, max, 0.1, true);
    }
    let seriesOpts = {
	points: {
	    show: false,
	    size: 5,
	    fill: dark ? "#fff" : "#000",
	}
    };
    
    function get_aggregates_for_series(data, minx, maxx, series_idx) {
	let aggs = { min: null, max: null, avg: null };
	let cnt = 0;
	let sum = 0;
	for (let i in data[0]) {
	    if (data[0][i] < minx) {
		continue;
	    }
	    if (data[0][i] > maxx) {
		break;
	    }

	    let val = data[series_idx][i];
	    if (val == null) {
		continue;
	    }
	    if (aggs.min == null || val < aggs.min) {
		aggs.min = val;
	    }
	    if (aggs.max == null || val > aggs.max) {
		aggs.max = val;
	    }
	    cnt += 1;
	    sum += val;
	}
	if (cnt > 0) {
	    aggs.avg = sum / cnt;
	}
	return aggs;
    };
    let legendFmts = {
	raw: uPlot.fmtDate("{YYYY}-{MMM}-{D} {H}:{mm}:{ss}"),
	day: uPlot.fmtDate("{YYYY}-{MMM}-{D}"),
	month: uPlot.fmtDate("{YYYY}-{MMM}"),
    };
    function get_values_for_legend(data, aggs, series_idx, idx, u, dist) {
	if (data[0].length == 0) {
	    return { Time: "", Value: "", Min: "", Avg: "", Max: "", Range: "", Share: "" };
	}
	if (idx == null) {
	    idx = data[0].length - 1;
	}
	let x = data[0][idx];
	// the numbers of a column are padded to the same decimals over all the
	// series, so that their decimal points line up
	let numbers = s => [data[s][idx], aggs[s].min, aggs[s].avg, aggs[s].max].map(v => format3(v));
	let all = [];
	for (let s = 1; s < data.length; s++) {
	    all.push(numbers(s));
	}
	let [value, min, avg, max] = numbers(series_idx).map((str, c) => pad_decimals(str, all.map(row => row[c])));
	let [range, share] = get_range_for_legend(u, dist, series_idx);
	return {
	    Time: profile_span() ? format_profile_x(x, true) : (legendFmts[average_mode] || legendFmts.raw)(new Date(x * 1e3)),
	    Value: value,
	    Min: min,
	    Avg: avg,
	    Max: max,
	    Range: range,
	    Share: share,
	};
    }
    // pads str with figure spaces to the most decimals in the column, the
    // legend is plain text, so the padding can't be hidden digits
    function pad_decimals(str, column) {
	let decimals = s => s.includes(".") ? s.length - s.indexOf(".") - 1 : 0;
	let pad = Math.max(0, ...column.filter(s => s != "").map(decimals)) - decimals(str);
	if (str == "" || pad <= 0) {
	    return str;
	}
	return str + (str.includes(".") ? "" : "\u2008") + "\u2007".repeat(pad);
    }

    // the chart the mouse is over, the range column only follows the cursor
    // of that chart, not the cursor synced from the other chart
    let hovered_chart = null;
    // the distribution bucket [lo, hi) at the cursor's y position, buckets
    // start from 0 and are a round 1, 2 or 5 times a power of ten wide, about
    // a hundredth of the visible y range
    function get_bucket(u, dist) {
	if (!dist || u != hovered_chart || u.cursor.top == null || u.cursor.top < 0) {
	    return null;
	}
	if (dist.range == null) {
	    return null;
	}
	let step = bucket_step(dist.range);
	let k = Math.floor(Math.max(u.posToVal(u.cursor.top, "y"), 0) / step);
	return [k * step, (k + 1) * step];
    }
    function bucket_step(range) {
	let raw = (range[1] - range[0]) / 100;
	let pow = Math.pow(10, Math.floor(Math.log10(raw)));
	let m = raw / pow;
	return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * pow;
    }
    // the distribution bucket at the cursor's y position and the percentage
    // of the visible results that fall in it
    function get_range_for_legend(u, dist, series_idx) {
	let bucket = get_bucket(u, dist);
	let vals = dist ? dist.vals[series_idx] : null;
	if (bucket == null || !vals || vals.length == 0) {
	    return ["", ""];
	}
	let [lo, hi] = bucket;
	let cnt = 0;
	for (let v of vals) {
	    if (v >= lo && v < hi) {
		cnt += 1;
	    }
	}
	return [format3(lo) + "\u2013" + format3(hi), (cnt * 100 / vals.length).toFixed(1) + "%"];
    }

    // sorted raw series values that fall in the visible x range
    function get_visible_values(data, in_view, series_idx) {
	let vals = [];
	for (let i = 0; i < data[0].length; i++) {
	    let val = data[series_idx][i];
	    if (val != null && in_view(i)) {
		vals.push(val);
	    }
	}
	return vals.sort((a, b) => a - b);
    }

    // the percentage of the values in each step wide bucket, the buckets
    // are given by their middles
    function get_histogram(vals, middles, step) {
	let ret = middles.map(() => 0);
	for (let v of vals) {
	    let k = Math.floor((v - middles[0] + step / 2) / step);
	    if (k >= 0 && k < middles.length) {
		ret[k] += 1;
	    }
	}
	return ret.map(cnt => vals.length > 0 ? cnt * 100 / vals.length : 0);
    }

    // a sideways chart next to the main chart: the vertical axis is the main
    // chart's y scale, the horizontal axis is the (unitless) percentage of the
    // results in each of the legend's range buckets
    function make_dist_chart(main_opts, el_id) {
	let range = [0, 100];
	let dist_opts = {
	    title: getDistTitle(),
	    ...getDistSize(),
	    cursor: { show: false },
	    legend: { show: false },
	    drawOrder: ["series", "axes"],
	    hooks: {
		// shade the bucket shown in the main chart's legend range column
		draw: [u => {
		    if (!u.band) {
			return;
		    }
		    let y0 = u.valToPos(u.band[0], "x", true);
		    let y1 = u.valToPos(u.band[1], "x", true);
		    let top = Math.max(Math.min(y0, y1), u.bbox.top);
		    let bottom = Math.min(Math.max(y0, y1), u.bbox.top + u.bbox.height);
		    if (bottom <= top) {
			return;
		    }
		    u.ctx.save();
		    u.ctx.fillStyle = "#8886";
		    u.ctx.fillRect(u.bbox.left, top, u.bbox.width, Math.max(bottom - top, 1));
		    u.ctx.restore();
		}],
	    },
	    scales: {
		x: {
		    time: false,
		    ori: 1,
		    dir: 1,
		    range: () => range,
		},
		y: {
		    ori: 0,
		    dir: 1,
		    range: (_, min, max) => [0, max > 0 ? max * 1.1 : 1],
		},
	    },
	    series: main_opts.series.map((s, i) => i == 0 ? {} : {
		label: s.label,
		fill: s.fill,
		points: { show: false },
	    }),
	    axes: [
		{
		    ...axis[1],
		    side: 3,
		    space: 30, // same tick spacing as the main y axis
		    // not 0, uplot only pads the plot top for axes with a non zero size
		    size: () => isNarrow() ? 1 : 50,
		    ticks: { ...axis[1].ticks, size: isNarrow() ? 0 : 10 },
		    values: (u, splits) => splits.map(v => isNarrow() ? "" : v.toLocaleString()),
		},
		{ ...axis[0], side: 2, space: 50, values: (u, splits) => splits.map(() => "") },
	    ],
	};
	let chart = new uPlot(dist_opts, [[], ...main_opts.series.slice(1).map(() => [])], el(el_id));
	// the y range the buckets cover and the visible values of each series,
	// the main chart's legend uses these too
	chart.range = null;
	chart.vals = [];
	let last = null;
	// forget the last computed distribution, for when the data changes
	chart.invalidate = function() {
	    last = null;
	};
	// called from the main chart's draw hook
	chart.update = function(main_chart, d) {
	    let ymin = main_chart.scales.y.min;
	    let ymax = main_chart.scales.y.max;
	    let xmin = main_chart.scales.x.min;
	    let xmax = main_chart.scales.x.max;
	    let key = [ymin, ymax, xmin, xmax].join();
	    if (key == last || ymin == null || !(ymax > ymin)) {
		return;
	    }
	    last = key;
	    range = [ymin, ymax];
	    // the same buckets as the legend's range column, drawn through the
	    // middle of each bucket
	    let step = bucket_step(range);
	    let middles = [];
	    for (let k = Math.floor(ymin / step); k < Math.ceil(ymax / step); k++) {
		middles.push((k + 0.5) * step);
	    }
	    let dist = [middles];
	    let vals = [null];
	    let in_view = raw_in_view(xmin, xmax);
	    for (let i = 1; i < d.length; i++) {
		vals.push(get_visible_values(d, in_view, i));
		dist.push(get_histogram(vals[i], middles, step));
	    }
	    chart.range = range;
	    chart.vals = vals;
	    chart.setData(dist);
	};
	return chart;
    }
    // in the time of day and week modes the x axis shows hours and weekdays
    // instead of dates
    function wrap_x_axis(u) {
	let axis = u.axes[0];
	let splits = axis.splits;
	let values = axis.values;
	axis.splits = function(u, axis_idx, min, max) {
	    if (!profile_span()) {
		return splits.apply(this, arguments);
	    }
	    let width = u.bbox.width / (window.devicePixelRatio || 1);
	    let space = average_mode == "dow" ? 70 : 50;
	    let step = [3600, 7200, 10800, 21600, 43200, 86400].find(s => s * width / (max - min) >= space) || 86400;
	    let ret = [];
	    for (let x = Math.ceil(min / step) * step; x <= max; x += step) {
		ret.push(x);
	    }
	    return ret;
	};
	axis.values = function(u, splits) {
	    if (!profile_span()) {
		return values.apply(this, arguments);
	    }
	    return splits.map(x => format_profile_x(x, false));
	};
    }
    // the legend columns only ever grow, so the centered legend doesn't jump
    // around while hovering, as the values change their widths
    function lock_legend_widths(u) {
	let head = u.root.querySelector(".u-legend thead tr");
	if (!head) {
	    return;
	}
	for (let th of head.cells) {
	    let width = Math.ceil(th.getBoundingClientRect().width);
	    if (width > (parseFloat(th.style.minWidth) || 0)) {
		th.style.minWidth = width + "px";
	    }
	}
    }
    function unlock_legend_widths() {
	for (let th of document.querySelectorAll(".u-legend thead th")) {
	    th.style.minWidth = "";
	}
    }
    function set_band(dist, band) {
	if (String(dist.band) != String(band)) {
	    dist.band = band;
	    dist.redraw(false);
	}
    }
    function dist_hooks(get_dist_chart, d) {
	return {
	    draw: [u => get_dist_chart().update(u, d)],
	    setSeries: [(u, sidx, opts) => {
		if (sidx != null && opts && opts.show != null) {
		    get_dist_chart().setSeries(sidx, { show: opts.show });
		}
	    }],
	    init: [u => {
		wrap_x_axis(u);
		u.over.addEventListener("mouseenter", () => { hovered_chart = u; });
		u.over.addEventListener("mouseleave", () => {
		    hovered_chart = null;
		    u.setLegend();
		    set_band(get_dist_chart(), null);
		});
	    }],
	    setLegend: [u => lock_legend_widths(u)],
	    // the range column depends on the y position, which alone doesn't
	    // update the legend
	    setCursor: [u => {
		if (u == hovered_chart) {
		    u.setLegend(undefined, false);
		    set_band(get_dist_chart(), get_bucket(u, get_dist_chart()));
		}
	    }],
	};
    }

    // the time of day ("tod") and week ("dow") modes average the results by
    // the hour of the day or week, the x axis is then the seconds since the
    // local midnight or monday's local midnight
    const profile_bucket = 3600;
    const weekdays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    function profile_span() {
	return average_mode == "tod" ? 86400 : average_mode == "dow" ? 7 * 86400 : 0;
    }
    // the x of the middle of the hour the result at ts falls in
    function profile_x(ts, mode) {
	let date = new Date(ts * 1e3);
	let x = date.getHours() * 3600;
	if (mode == "dow") {
	    x += ((date.getDay() + 6) % 7) * 86400;
	}
	return x + profile_bucket / 2;
    }
    function format_profile_x(x, bucket) {
	let hm = x => formatNumber(Math.floor(x % 86400 / 3600), 2) + ":" + formatNumber(Math.floor(x % 3600 / 60), 2);
	let day = average_mode == "dow" ? weekdays[Math.floor(x / 86400) % 7] + " " : "";
	if (!bucket) {
	    return average_mode == "dow" && x % 86400 == 0 ? day.trim() : hm(x);
	}
	let start = x - profile_bucket / 2;
	return day + hm(start) + "-" + hm(start + profile_bucket).replace(/^00:00$/, "24:00");
    }

    // averages of every series over local time days or months, the bucket
    // start is the timestamp, or over the hours of the day or week, "raw"
    // returns the data as is
    function get_averaged_data(data, mode) {
	if (mode == "tod" || mode == "dow") {
	    let n = (mode == "tod" ? 86400 : 7 * 86400) / profile_bucket;
	    let sums = data.map(() => new Array(n).fill(0));
	    let cnts = data.map(() => new Array(n).fill(0));
	    for (let i = 0; i < data[0].length; i++) {
		let b = Math.floor(profile_x(data[0][i], mode) / profile_bucket);
		for (let s = 1; s < data.length; s++) {
		    if (data[s][i] != null) {
			sums[s][b] += data[s][i];
			cnts[s][b] += 1;
		    }
		}
	    }
	    // hours without any results are left out, so the line connects the
	    // hours around them
	    let ret = data.map(() => []);
	    for (let b = 0; b < n; b++) {
		if (!cnts.some((cnt, s) => s > 0 && cnt[b] > 0)) {
		    continue;
		}
		ret[0].push(b * profile_bucket + profile_bucket / 2);
		for (let s = 1; s < data.length; s++) {
		    ret[s].push(cnts[s][b] > 0 ? sums[s][b] / cnts[s][b] : null);
		}
	    }
	    return ret;
	}
	if (mode != "day" && mode != "month") {
	    return data;
	}
	let ret = data.map(() => []);
	let sums = null;
	let cnts = null;
	let flush = function() {
	    if (sums == null) {
		return;
	    }
	    for (let s = 1; s < data.length; s++) {
		ret[s].push(cnts[s] > 0 ? sums[s] / cnts[s] : null);
	    }
	};
	let bucket = null;
	for (let i = 0; i < data[0].length; i++) {
	    let date = new Date(data[0][i] * 1e3);
	    let start = mode == "day" ?
		new Date(date.getFullYear(), date.getMonth(), date.getDate()) :
		new Date(date.getFullYear(), date.getMonth(), 1);
	    let ts = start.getTime() / 1e3;
	    if (ts != bucket) {
		flush();
		bucket = ts;
		ret[0].push(ts);
		sums = data.map(() => 0);
		cnts = data.map(() => 0);
	    }
	    for (let s = 1; s < data.length; s++) {
		if (data[s][i] != null) {
		    sums[s] += data[s][i];
		    cnts[s] += 1;
		}
	    }
	}
	flush();
	return ret;
    }

    // the charts keep these arrays, they get refilled when the averaging changes
    let d = [];
    let d2 = [];
    // the raw results in the same series order as the charts, the y axis
    // range and the distributions are always computed from these
    let rd = [data[0], data[4], data[5]];
    let rd2 = [data[0], data[2], data[3], data[1]];
    // an averaged point stands for the results until the next day or month,
    // so the raw results of the last visible point reach until then
    function raw_x_end(maxx) {
	if (average_mode == "raw" || !isFinite(maxx)) {
	    return maxx;
	}
	let date = new Date(maxx * 1e3);
	let next = average_mode == "day" ?
	    new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1) :
	    new Date(date.getFullYear(), date.getMonth() + 1, 1);
	return next.getTime() / 1e3 - 0.001;
    }
    // which raw results are behind the averaged points in the visible x range
    let raw_profile_x = [];
    function raw_in_view(minx, maxx) {
	if (profile_span()) {
	    return i => in_time_interval(data[0][i]) && raw_profile_x[i] >= minx && raw_profile_x[i] <= maxx;
	}
	let end = raw_x_end(maxx);
	return i => data[0][i] >= minx && data[0][i] <= end;
    }
    function set_chart_data(mode) {
	raw_profile_x = profile_span() ? data[0].map(ts => profile_x(ts, mode)) : [];
	let src = data;
	if (profile_span() && time_interval) {
	    // the time of day and week averages only cover the picked interval
	    let idxs = data[0].map((ts, i) => i).filter(i => in_time_interval(data[0][i]));
	    src = data.map(series => idxs.map(i => series[i]));
	}
	let a = get_averaged_data(src, mode);
	[d[0], d[1], d[2]] = [a[0], a[4], a[5]];
	[d2[0], d2[1], d2[2], d2[3]] = [a[0], a[2], a[3], a[1]];
    }
    // the table of the results in the picked time interval, at most
    // table_max_rows of them, sorted by any column
    const table_max_rows = 100;
    // the text columns from the results file, older data.js doesn't have them
    let info = typeof data_info == "undefined" ? [] : data_info;
    const table_cols = [
	{ name: "Time", get: i => data[0][i], fmt: v => legendFmts.raw(new Date(v * 1e3)) },
	{ name: "Download (Mbps)", get: i => data[4][i], fmt: format3 },
	{ name: "Upload (Mbps)", get: i => data[5][i], fmt: format3 },
	{ name: "Latency Idle (ms)", get: i => data[1][i], fmt: format3 },
	{ name: "Latency Downloading (ms)", get: i => data[2][i], fmt: format3 },
	{ name: "Latency Uploading (ms)", get: i => data[3][i], fmt: format3 },
	{ name: "Client IP", get: i => info[i]?.[0] },
	{ name: "ISP", get: i => info[i]?.[1] },
	{ name: "Server", get: i => info[i]?.[2] },
	{ name: "Server Host", get: i => info[i]?.[3] },
	{ name: "Error", get: i => info[i]?.[4] },
    ];
    // newest first by default, a click on a header sorts by that column, a
    // second click reverses the order
    let table_sort = { col: 0, desc: true };
    function show_results_table() {
	let head = el("results_table").tHead.rows[0];
	if (head.cells.length == 0) {
	    table_cols.forEach((col, c) => {
		let th = document.createElement("th");
		th.className = col.fmt == format3 ? "num" : "";
		th.addEventListener("click", () => {
		    table_sort = table_sort.col == c ? { col: c, desc: !table_sort.desc } : { col: c, desc: c == 0 };
		    show_results_table();
		});
		head.appendChild(th);
	    });
	}
	table_cols.forEach((col, c) => {
	    head.cells[c].textContent = col.name + (table_sort.col == c ? (table_sort.desc ? " \u25bc" : " \u25b2") : "");
	});

	// a single result is in data twice, so the charts have a line to draw
	let cnt = info.length || data[0].length;
	let rows = [];
	for (let i = 0; i < cnt; i++) {
	    if (in_time_interval(data[0][i])) {
		rows.push(i);
	    }
	}
	let get = table_cols[table_sort.col].get;
	let empty = v => v == null || v === "" || Number.isNaN(v);
	rows.sort((a, b) => {
	    let va = get(a);
	    let vb = get(b);
	    // empty values are last either way
	    if (empty(va) || empty(vb)) {
		return empty(va) - empty(vb) || data[0][b] - data[0][a];
	    }
	    let cmp = typeof va == "number" ? va - vb : String(va).localeCompare(String(vb));
	    return (table_sort.desc ? -cmp : cmp) || data[0][b] - data[0][a];
	});

	let total = rows.length;
	let cells = rows.slice(0, table_max_rows).map(i => table_cols.map(col => {
	    let v = col.get(i);
	    return empty(v) ? "" : col.fmt ? col.fmt(v) : String(v);
	}));
	// numbers are right aligned and padded with hidden decimals to the most
	// decimals in their column, so the decimal points line up
	let decimals = s => s.includes(".") ? s.length - s.indexOf(".") - 1 : 0;
	let max_decimals = table_cols.map((col, c) => Math.max(0, ...cells.map(row => decimals(row[c]))));
	let body = document.createElement("tbody");
	for (let row of cells) {
	    let tr = body.insertRow();
	    table_cols.forEach((col, c) => {
		let td = tr.insertCell();
		td.textContent = row[c];
		if (col.fmt != format3) {
		    return;
		}
		td.className = "num";
		let pad = max_decimals[c] - decimals(row[c]);
		if (row[c] != "" && pad > 0) {
		    let span = document.createElement("span");
		    span.className = "pad";
		    span.textContent = (row[c].includes(".") ? "" : ".") + "0".repeat(pad);
		    td.appendChild(span);
		}
	    });
	}
	el("results_table").replaceChild(body, el("results_table").tBodies[0]);
	el("results_table_caption").textContent = total > table_max_rows ?
	    "First " + table_max_rows + " of " + total + " results" + (time_interval ? " in the picked interval" : "") :
	    total + " results" + (time_interval ? " in the picked interval" : "");
    }

    // the picked [from, to] time interval of the raw results, null for all
    // of them, zooming the raw, day or month charts picks it, and it is
    // kept when changing to another mode
    let time_interval = null;
    function in_time_interval(ts) {
	return time_interval == null || (ts >= time_interval[0] && ts <= time_interval[1]);
    }
    // the x range the charts were last set to when the mode changed, it
    // doesn't change the picked interval
    let restored_x = null;
    function on_x_range(r) {
	if (profile_span() || no_data || d[0].length == 0) {
	    return;
	}
	if (restored_x && r[0] == restored_x[0] && r[1] == restored_x[1]) {
	    return;
	}
	if (r[0] <= d[0][0] && r[1] >= d[0][d[0].length - 1]) {
	    time_interval = null;
	}
	else {
	    time_interval = [r[0], raw_x_end(r[1])];
	}
	show_time_interval();
    }
    let interval_fmt = uPlot.fmtDate("{YYYY}-{MMM}-{D} {H}:{mm}");
    function show_time_interval() {
	let cnt = data[0].filter(in_time_interval).length;
	let text = cnt + " results";
	if (cnt > 0) {
	    let first = data[0].find(in_time_interval);
	    let last = data[0].findLast(in_time_interval);
	    text = interval_fmt(new Date(first * 1e3)) + " \u2013 " + interval_fmt(new Date(last * 1e3)) + ", " + text;
	}
	el("time_interval_text").textContent = (time_interval ? "" : "All: ") + text;
	el("time_interval_clear").style.display = time_interval ? "" : "none";
	show_results_table();
    }
    // the start of the day or month ts falls in
    function bucket_start(ts, mode) {
	let date = new Date(ts * 1e3);
	if (mode == "day") {
	    return new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime() / 1e3;
	}
	if (mode == "month") {
	    return new Date(date.getFullYear(), date.getMonth(), 1).getTime() / 1e3;
	}
	return ts;
    }

    let average_mode = "raw";
    try {
	average_mode = localStorage.getItem("average") || "raw";
    } catch (e) {}
    set_chart_data(average_mode);

    let aggregates = [];
    for (let i in d) {
	aggregates.push({ min: null, max: null, avg: null });
    }

    let aggregates2 = [];
    for (let i in d2) {
	aggregates2.push({ min: null, max: null, avg: null });
    }

    let opts = {
	title: "Speed (Bandwidth)",
	...getSize(),
	cursor: cursorOpts,
	drawOrder: ["series", "axes"],

	scales: {
	    x: {
		range: (u, min, max) => {
//		    debug("scales x min:" + min + " max:" + max);
		    let r = x_range(min, max);
		    u.x_view = r;
		    on_x_range(r);
		    for (let i = 1; i < d.length; i++) {
			aggregates[i] = get_aggregates_for_series(d, r[0], r[1], i);
		    }
		    for (let i = 1; i < d2.length; i++) {
			aggregates2[i] = get_aggregates_for_series(d2, r[0], r[1], i);
		    }
		    if (chart1) {
			chart1.setLegend();
		    }
		    if (chart2) {
			chart2.setLegend();
		    }
		    return r;
		}
	    },
	    y: {
		range: (u, min, max) => y_range(u, min, max, rd)
	    },
	},

	series: [
	    {},
	    {
		label: "Download (Mbps)",
		fill: "rgba(255, 0, 0, 0.7)",
		...seriesOpts,
		values: (u, sidx, idx) => { return get_values_for_legend(d, aggregates, sidx, idx, u, dist1); }
	    },
	    {
		label: "Upload (Mbps)",
		fill: "rgba(0, 0, 255, 0.7)",
		...seriesOpts,
		values: (u, sidx, idx) => { return get_values_for_legend(d, aggregates, sidx, idx, u, dist1); }
	    }
	],
	axes: axis,
	hooks: dist_hooks(() => dist1, rd),
    };
    dist1 = make_dist_chart(opts, "dist1");
    chart1 = new uPlot(opts, d, document.getElementById("chart1"));

    let opts2 = {
	title: "Ping (Latency)",
	...getSize(),
	cursor: cursorOpts,
	drawOrder: ["series", "axes"],
	scales: {
	    x: {
		range: (u, min, max) => {
		    u.x_view = x_range(min, max);
		    on_x_range(u.x_view);
		    return u.x_view;
		}
	    },
	    y: {
		range: (u, min, max) => y_range(u, min, max, rd2, latency_max_drop)
	    },
	},
	series: [
	    {},
	    {
		label: "Latency While Downloading (ms)",
		fill: "rgba(255, 0, 0, 0.5)",
		...seriesOpts,
		values: (u, sidx, idx) => { return get_values_for_legend(d2, aggregates2, sidx, idx, u, dist2); }
	    },
	    {
		label: "Latency While Uploading (ms)",
		fill: "rgba(0, 0, 255, 0.5)",
		...seriesOpts,
		values: (u, sidx, idx) => { return get_values_for_legend(d2, aggregates2, sidx, idx, u, dist2); }
	    },
	    {
		label: "Latency When Idle (ms)",
		fill: "rgba(50, 150, 50, 1)",
		...seriesOpts,
		values: (u, sidx, idx) => { return get_values_for_legend(d2, aggregates2, sidx, idx, u, dist2); }
	    },
	],
	axes: axis,
	hooks: dist_hooks(() => dist2, rd2),
    };
    dist2 = make_dist_chart(opts2, "dist2");
    chart2 = new uPlot(opts2, d2, document.getElementById("chart2"));

    for (let input of document.querySelectorAll("#average_selector input")) {
	input.checked = input.value == average_mode;
	input.addEventListener("change", () => {
	    average_mode = input.value;
	    try {
		localStorage.setItem("average", average_mode);
	    } catch (e) {}
	    apply_mode();
	});
    }
    el("time_interval_clear").addEventListener("click", () => {
	time_interval = null;
	apply_mode();
    });
    show_time_interval();

    // takes new results after a test, the charts keep their zoom unless
    // they show everything, then they show the new results too
    refreshData = function(new_data, new_info) {
	for (let k = 0; k < data.length; k++) {
	    data[k] = new_data[k];
	}
	[rd[0], rd[1], rd[2]] = [data[0], data[4], data[5]];
	[rd2[0], rd2[1], rd2[2], rd2[3]] = [data[0], data[2], data[3], data[1]];
	info = new_info;
	no_data = data[0].length == 0;
	set_chart_data(average_mode);
	dist1.invalidate();
	dist2.invalidate();
	let span = profile_span();
	for (let [chart, cd] of [[chart1, d], [chart2, d2]]) {
	    let [min, max] = [chart.scales.x.min, chart.scales.x.max];
	    let zoomed = span ? !(min == 0 && max == span) : time_interval != null;
	    if (zoomed) {
		restored_x = [min, max];
		chart.setData(cd, false);
		chart.setScale("x", { min: min, max: max });
	    }
	    else {
		chart.setData(cd);
	    }
	}
	show_time_interval();
    };

    // refills the charts for the current mode, keeping the picked interval
    function apply_mode() {
	unlock_legend_widths();
	set_chart_data(average_mode);
	dist1.invalidate();
	dist2.invalidate();
	if (profile_span() || time_interval == null) {
	    restored_x = null;
	    chart1.setData(d);
	    chart2.setData(d2);
	}
	else {
	    restored_x = [bucket_start(time_interval[0], average_mode), time_interval[1]];
	    for (let [chart, cd] of [[chart1, d], [chart2, d2]]) {
		chart.setData(cd, false);
		chart.setScale("x", { min: restored_x[0], max: restored_x[1] });
	    }
	}
	show_time_interval();
    }

    window.addEventListener("resize", e => {
	chart1.setSize(getSize());
	chart2.setSize(getSize());
	for (let dist of [dist1, dist2]) {
	    dist.axes[0].ticks.size = isNarrow() ? 0 : 10;
	    dist.setSize(getDistSize());
	    dist.root.querySelector(".u-title").textContent = getDistTitle();
	}
    });

    request(null, onRequest);
}
window.onload = initSpeedKetchup;
    </script>
  </body>
</html>
