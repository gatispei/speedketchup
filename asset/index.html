    <style>
      html, body {
	  max-width: 100%;
	  overflow-x: hidden;
	  -webkit-tap-highlight-color:transparent;
          background-color: white;
          color: black;
      }
      #dashboard {
	  display: flex;
	  flex-wrap: wrap;
	  justify-content: center;
      }
      #dashboard svg {
	  flex: none;
      }
      .gauge {
	  display: flex;
	  flex-direction: column;
	  align-items: center;
      }
      .gauge_name {
	  font-size: 16px;
	  font-weight: bold;
	  margin-top: 2px;
	  cursor: pointer;
      }
      .gauge_name.dimmed {
	  opacity: 0.4;
      }
      .gauge_name:empty {
	  display: none;
      }
      .dash_outline {
	  fill: #fff;
      }
      input[type="range"] {
	  width: 200px;
	  margin: 0;
      }
      #average_selector {
	  text-align: center;
	  margin: 4px 0;
	  user-select: none;
	  -webkit-user-select: none;
      }
      #average_selector input {
	  display: none;
      }
      #average_selector span {
	  display: inline-block;
	  padding: 3px 10px;
	  border: 1px solid #8888;
	  margin-left: -1px;
	  cursor: pointer;
      }
      #average_selector label:first-of-type span {
	  border-radius: 4px 0 0 4px;
      }
      #average_selector label:last-of-type span {
	  border-radius: 0 4px 4px 0;
      }
      #average_selector input:checked + span {
	  background-color: #ddd;
      }
      /* the chart legends */
      .u-legend {
	  font-size: 12px;
	  border-collapse: collapse;
	  font-variant-numeric: tabular-nums;
      }
      .u-legend thead th {
	  font-size: 11px;
	  font-weight: normal;
	  color: #888;
	  text-align: right;
	  padding: 2px 8px;
	  border-bottom: 1px solid #8886;
      }
      .u-legend tbody th {
	  text-align: left;
	  padding: 2px 8px;
      }
      .u-legend tbody tr + tr {
	  border-top: 1px solid #8883;
      }
      .u-legend td.u-value {
	  text-align: right;
	  padding: 2px 8px;
      }
      /* the time is the same for every series */
      .u-legend td.u-value:nth-of-type(1) {
	  color: #888;
      }
      .u-legend td.u-value:nth-of-type(2) {
	  font-weight: bold;
      }
      /* the range and share are empty until hovering, keep their room */
      .u-legend td.u-value:nth-of-type(6) {
	  min-width: 7em;
      }
      .u-legend td.u-value:nth-of-type(7) {
	  min-width: 3.5em;
      }
      #results_table_wrap {
	  overflow-x: auto;
	  margin: 16px 0;
      }
      #results_table_caption {
	  text-align: center;
	  margin-bottom: 4px;
      }
      #results_table {
	  /* the page is in quirks mode, where tables don't inherit the font */
	  font-size: inherit;
	  border-collapse: collapse;
	  margin: 0 auto;
	  white-space: nowrap;
      }
      #results_table th, #results_table td {
	  padding: 2px 8px;
	  border-bottom: 1px solid #8884;
	  text-align: left;
      }
      #results_table th {
	  cursor: pointer;
	  user-select: none;
	  -webkit-user-select: none;
      }
      #results_table .num {
	  text-align: right;
	  font-variant-numeric: tabular-nums;
      }
      #results_table .pad {
	  visibility: hidden;
      }
      #results_table tbody tr:hover {
	  background-color: #8882;
      }
      #time_interval {
	  text-align: center;
	  margin: 4px 0;
      }
      #time_interval_clear {
	  cursor: pointer;
	  padding: 0 4px;
	  font-size: 13px;
      }

      @media (prefers-color-scheme: dark) {
	  body {
              background-color: black;
              color: white;
	  }
	  .dash_outline {
	      fill: #000;
	      stroke: #aaa;
	  }
	  #average_selector input:checked + span {
	      background-color: #444;
	  }
	  .st, .bt {
	      fill: #fff;
	  }

	      fill: #222;
	  }
	  .upload_progress_band {
	      fill: #444;
	  }
	  .download_progress_band {
	      fill: #444;
	  }
	  .download_speed_band {

	  }

	      fill: #008;
	  }
	  .inactive_button_circle {
	      fill: #333;
	  }
	  .u-select { /* selection area in char */
	      background: #fff1;
	      position: absolute;
	      pointer-events: none;
	  }
      }

    <script type="text/javascript">
function getHeight() {
    return Math.max(window.innerHeight / 2 - 200, 200);
}
function getSize() {
    return {
	width: window.innerWidth - getDistSize().width,
	height: getHeight(),
    }
}
// on narrow screens the distribution charts drop their value labels, the
// main chart next to them already shows the same scale
function isNarrow() {
    return window.innerWidth < 600;
}
function getDistTitle() {
    return isNarrow() ? "Dist." : "Distribution";
}
// the distribution charts take 20% of the total width
function getDistSize() {
    return {
	width: Math.floor(window.innerWidth * 0.2),
	height: getHeight(),
    }
}

function formatNumber(num, width) {
    var ret = "" + num;
    while (ret.length < width) {
	ret = "0" + ret;
    }
    return ret;
}
function format3(num, postfix = "") {
    if (typeof num == "undefined" || num == null || Number.isNaN(num)) return "";
    if (num < 1) return "" + num.toFixed(3) + postfix;
    if (num < 10) return "" + num.toFixed(2) + postfix;
    if (num < 100) return "" + num.toFixed(1) + postfix;
    return "" + num.toFixed(0) + postfix;
}

function el(id) {
    return document.getElementById(id);
}

function debug(str) {
    if (!console) {
	return;
    }
    if (typeof str == "string") {
	var d = new Date();
	console.debug(
	    d.getFullYear() + "." +
		formatNumber(d.getMonth() + 1, 2) + "." +
		formatNumber(d.getDate(), 2) + " " +
		formatNumber(d.getHours(), 2) + ":" +
		formatNumber(d.getMinutes(), 2) + ":" +
		formatNumber(d.getSeconds(), 2) + "." +
		formatNumber(d.getMilliseconds(), 3) + ": " + str);
    }
    else {
	console.debug(str);
    }
}

// full gauge is 270 degrees, divided in 4 equal sections
// section 1: 0 - 1 Mbps, linear
// section 2,3,4: 1 - 1000 Mbps, logaritmic
function speed_to_gauge_degrees(mbps) {
    if (mbps < 1) {
	return mbps * (270 / 4);
    }
    var ret = Math.log10(mbps) + 1;
    if (ret > 4) {
	ret = 4;
    }
    return ret * (270 / 4);
}
function deg_to_rad(deg) {
    return deg * Math.PI / 180;
}
function degrees_to_clip_path(deg) {
    var ri = 50;
    var pi = Math.sqrt(ri * ri / 2).toFixed(2);
    var rad = deg_to_rad(deg);
    var cos = Math.cos(rad);
    var sin = Math.sin(rad);
    var pti = [-(cos * pi + sin * pi).toFixed(2), (cos * pi - sin * pi).toFixed(2)];

    var s = 0;
    if (deg >= 180) {
	s = 1;
    }

    ret = " l -" + pi + " " + pi;
    ret += " a " + ri + " " + ri + " 1 " + s + " 1 " + (pti[0] - -pi) + " " + (pti[1] - pi);
    ret += " z";
    return ret;
}

// the gauges of the profile at index i
function gauge_el(i, id) {
    return el("p" + i + "_" + id);
}
var gauge_count = 0;
function build_gauges(profiles) {
    let html = el("gauge_template").innerHTML;
    gauge_count = profiles.length;
    profiles.forEach((p, i) => {
	el("dashboard").insertAdjacentHTML("beforeend", html.replaceAll("{p}", "p" + i + "_").replaceAll("{n}", i + 1));
	if (profiles.length > 1) {
	    gauge_el(i, "name").textContent = p.name;
	}
    });
}

function request(obj, cb) {
//    debug("request");
    var req = new XMLHttpRequest();
    req.onreadystatechange = function() {
	if (req.readyState == 4) {
	    if (req.status == 200) {
		cb(req.responseText);
	    }
	    else {
		cb(null);
	    }
	    req = null;
        }
    };
    req.timeout = 60 * 1000;
    req.open("POST", "status", true);
    req.send(obj);
}

var stateStr = "";
function profile_names_of(state) {
    return JSON.stringify(state.profiles.map(p => p.name));
}
var profile_names = profile_names_of(stateObj);
function dashboard_set() {
    for (let i = 0; i < gauge_count; i++) {
	gauge_set(i, stateObj && stateObj.state ? stateObj.profiles[i] : null);
    }
}

function gauge_set(i, p) {
    if (!p) {
	gauge_el(i, "start_button").style.visibility = "hidden";
	gauge_el(i, "stop_button").style.visibility = "hidden";
	gauge_el(i, "disconnected_button").style.visibility = "visible";
	gauge_el(i, "disconnected2_button").style.visibility = "visible";
	return;
    }
    gauge_el(i, "disconnected_button").style.visibility = "hidden";
    gauge_el(i, "disconnected2_button").style.visibility = "hidden";
    if (p.state == "idle") {
	gauge_el(i, "start_button").style.visibility = "visible";
	gauge_el(i, "stop_button").style.visibility = "hidden";
    }
    else {
	gauge_el(i, "start_button").style.visibility = "hidden";
	gauge_el(i, "stop_button").style.visibility = "visible";
    }
    // anything missing from the state is shown as on a fresh page load, so
    // the gauges after a test look the same as after reloading the page
    gauge_el(i, "idle_latency").textContent = p.latency ? format3(p.latency, "ms") : "";
    set_speed_gauge(i, "download", 45, p.download_mbps);
    set_progress_band(i, "download", 45, p.download_progress);
    gauge_el(i, "download_latency").textContent = p.download_latency ? format3(p.download_latency, "ms") : "";
    set_speed_gauge(i, "upload", 155, p.upload_mbps);
    set_progress_band(i, "upload", 155, p.upload_progress);
    gauge_el(i, "upload_latency").textContent = p.upload_latency ? format3(p.upload_latency, "ms") : "";
}

function set_speed_gauge(i, name, cx, mbps) {
    if (!mbps) {
	gauge_el(i, name + "_mbps").textContent = "";
	gauge_el(i, name + "_needle").style.visibility = "hidden";
	gauge_el(i, name + "_speed_band_clip_path").setAttribute("d", "");
	return;
    }
    gauge_el(i, name + "_mbps").textContent = format3(mbps);
    var deg = speed_to_gauge_degrees(mbps);
    gauge_el(i, name + "_needle").transform.baseVal[0].setRotate(-135 + deg, cx, 50);
    gauge_el(i, name + "_needle").style.visibility = "visible";
    gauge_el(i, name + "_speed_band_clip_path").setAttribute("d", "M" + cx + " 50" + degrees_to_clip_path(deg));
}

function set_progress_band(i, name, cx, progress) {
    gauge_el(i, name + "_progress_band_clip_path").setAttribute("d", progress ? "M" + cx + " 50" + degrees_to_clip_path(progress * 270 / 100) : "");
}

function onRequest(r) {
//    debug("on request " + r);
    if (r == null) {
	stateStr = "connection lost";
	stateObj = {};
	dashboard_set();
	setTimeout(function () { request(null, onRequest); }, 1000);
	return;
    }

    stateStr = r;
    stateNew = JSON.parse(r);
    if (stateObj.state != stateNew.state)  {
	debug("old:" + stateObj.state + " new:" + stateNew.state);
    }
    // the settings changed the profiles, the gauges and charts are made for them
    if (profile_names_of(stateNew) != profile_names) {
	window.location.reload();
	return;
    }
    if ((stateObj.profiles || []).some((p, i) => p.state != "idle" && stateNew.profiles[i].state == "idle")) {
	// a test finished, show its result
	debug("refresh on idle");
	refreshResults();
    }
    stateOld = stateObj;
    stateObj = stateNew;
    updateIdleTime();
    dashboard_set();
    setTimeout(function () { request(stateStr, onRequest); }, 100);
};

// the results come as rows, the time in seconds and the rest of the line of
// the results file, the charts take them as columns: time, idle, download and
// upload latency, download and upload speed, and the number of the profile,
// counting from 1. data_info has the text columns, client ip, isp, server
// description, server host and error, of every result
var data = [[], [], [], [], [], [], []];
var data_info = [];
// the highest profile number of the results, and how many the charts show
const max_profiles = 16;
var data_max_profile = 1;
var chart_profiles = 1;
// a lone result is there twice, a second apart, a chart needs two points
var data_padded = false;

// splits a line of the results file into fields, a field can be in quotes
function csvFields(line) {
    let ret = [], field = "", quoted = false, start = 0;
    let re = /[",]/g, m;
    while ((m = re.exec(line)) != null) {
	let i = m.index;
	field += line.slice(start, i);
	start = i + 1;
	if (line[i] == ",") {
	    if (quoted) {
		field += ",";
	    }
	    else {
		ret.push(field);
		field = "";
	    }
	}
	else if (quoted && line[i + 1] == '"') {
	    field += '"';
	    start = i + 2;
	    re.lastIndex = start;
	}
	else {
	    quoted = !quoted;
	}
    }
    ret.push(field + line.slice(start));
    return ret;
}

function addRows(rows) {
    if (data_padded) {
	for (let col of data) {
	    col.pop();
	}
	data_padded = false;
    }
    for (let row of rows) {
	let f = csvFields(row);
	data[0].push(Number(f[0]));
	for (let k = 1; k < 6; k++) {
	    let v = parseFloat(f[k]);
	    data[k].push(isNaN(v) ? null : v);
	}
	let info = [];
	for (let k = 6; k < 11; k++) {
	    info.push(f[k] ?? "");
	}

// fetches the results after the ones there are and updates the charts in
// place, keeping the mode, the zoom and the table sorting, falls back to
// reloading the page
function refreshResults() {
    fetch("data.json?from=" + data_end)
	.then(r => {
	    if (!r.ok) {
		throw new Error("status " + r.status);
	    }
	    return r.json();
	})
	.then(j => {
	    // the results file got shorter or was edited, all of it came again
	    if (j.from != data_end) {
		for (let col of data) {
		    col.length = 0;
		}
		data_info.length = 0;
		data_padded = false;
	    }
	    addRows(j.rows);
	    data_end = j.end;
	    if (data_max_profile > chart_profiles) {
		throw new Error("results of a new profile");
	    }
	    refreshData(data, data_info);
	})
	.catch(e => {
	    debug("refresh failed, reloading: " + e);
	    window.location.reload();
	});
}

	    return data.slice(0, 6);
	}
	let ret = [data[0]];
	for (let p = 1; p <= chart_profiles; p++) {
	    for (let k = 1; k < 6; k++) {
		let col = data[k].map((v, i) => data[6][i] == p ? v : undefined);
		// the other profiles' rows between failed tests are in the gap too
		let after_failed = false;
		let gap_start = -1;
		for (let i = 0; i < col.length; i++) {
		    if (col[i] === null) {
			if (after_failed) {
			    col.fill(null, gap_start, i);
			}
			after_failed = true;
			gap_start = i + 1;
		    }
		    else if (col[i] !== undefined) {
			after_failed = false;
		    }
		}
		ret.push(col);
	    }
	}
	return ret;
    }
    // into the charts' series order from a[0] and the columns of every profile
    function set_series(speed, latency, a) {
	speed[0] = latency[0] = a[0];
	for (let p = 0; p < chart_profiles; p++) {
	    let col = k => a[p * 5 + k];
	    speed[1 + p * 2] = col(4);
	    speed[2 + p * 2] = col(5);
	    latency[1 + p * 3] = col(2);
	    latency[2 + p * 3] = col(3);
	    latency[3 + p * 3] = col(1);
	}
    }
    // an averaged point stands for the results until the next day or month,
    // so the raw results of the last visible point reach until then
    function raw_x_end(maxx) {
	if (average_mode == "raw" || !isFinite(maxx)) {
	    return maxx;
	}
	let date = new Date(maxx * 1e3);
	let next = average_mode == "day" ?
	    new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1) :
	    new Date(date.getFullYear(), date.getMonth() + 1, 1);
	return next.getTime() / 1e3 - 0.001;
    }
    // which raw results are behind the averaged points in the visible x range
    let raw_profile_x = [];
    function raw_in_view(minx, maxx) {
	if (profile_span()) {
	    return i => in_time_interval(data[0][i]) && raw_profile_x[i] >= minx && raw_profile_x[i] <= maxx;
	}
	let end = raw_x_end(maxx);
	return i => data[0][i] >= minx && data[0][i] <= end;
    }
    function set_chart_data(mode) {
	raw_profile_x = profile_span() ? data[0].map(ts => profile_x(ts, mode)) : [];
	let columns = profile_columns();
	set_series(rd, rd2, columns);
	let src = columns;
	if (profile_span() && time_interval) {
	    // the time of day and week averages only cover the picked interval
	    let idxs = data[0].map((ts, i) => i).filter(i => in_time_interval(data[0][i]));
	    src = columns.map(series => idxs.map(i => series[i]));
	}
	set_series(d, d2, get_averaged_data(src, mode));
    }
    // the table of the results in the picked time interval, at most
    // table_max_rows of them, sorted by any column
    const table_max_rows = 100;
    let info = data_info;
    const table_cols = [
	{ name: "Time", get: i => data[0][i], fmt: v => legendFmts.raw(new Date(v * 1e3)) },
	{ name: "Download (Mbps)", get: i => data[4][i], fmt: format3 },
	{ name: "Upload (Mbps)", get: i => data[5][i], fmt: format3 },
	{ name: "Latency Idle (ms)", get: i => data[1][i], fmt: format3 },
	{ name: "Latency Downloading (ms)", get: i => data[2][i], fmt: format3 },
	{ name: "Latency Uploading (ms)", get: i => data[3][i], fmt: format3 },
	{ name: "Client IP", get: i => info[i]?.[0] },
	{ name: "ISP", get: i => info[i]?.[1] },
	{ name: "Server", get: i => info[i]?.[2] },
	{ name: "Server Host", get: i => info[i]?.[3] },
	{ name: "Error", get: i => info[i]?.[4] },
    ];
    if (several) {
	table_cols.splice(1, 0, { name: "Profile", get: i => profile_name(data[6][i]) });
    }
    // newest first by default, a click on a header sorts by that column, a
    // second click reverses the order
    let table_sort = { col: 0, desc: true };
    function show_results_table() {
	let head = el("results_table").tHead.rows[0];
	if (head.cells.length == 0) {
	    table_cols.forEach((col, c) => {
		let th = document.createElement("th");
		th.className = col.fmt == format3 ? "num" : "";
		th.addEventListener("click", () => {
		    table_sort = table_sort.col == c ? { col: c, desc: !table_sort.desc } : { col: c, desc: c == 0 };
		    show_results_table();
		});
		head.appendChild(th);
	    });
	}
	table_cols.forEach((col, c) => {
	    head.cells[c].textContent = col.name + (table_sort.col == c ? (table_sort.desc ? " \u25bc" : " \u25b2") : "");
	});

	// a single result is in data twice, so the charts have a line to draw
	let cnt = info.length || data[0].length;
	let rows = [];
	for (let i = 0; i < cnt; i++) {
	    if (result_shown(data[0][i], i)) {
		rows.push(i);
	    }
	}
	let get = table_cols[table_sort.col].get;
	let empty = v => v == null || v === "" || Number.isNaN(v);
	rows.sort((a, b) => {
	    let va = get(a);
	    let vb = get(b);
	    // empty values are last either way
	    if (empty(va) || empty(vb)) {
		return empty(va) - empty(vb) || data[0][b] - data[0][a];
	    }
	    let cmp = typeof va == "number" ? va - vb : String(va).localeCompare(String(vb));
	    return (table_sort.desc ? -cmp : cmp) || data[0][b] - data[0][a];
	});

	let total = rows.length;
	let cells = rows.slice(0, table_max_rows).map(i => table_cols.map(col => {
	    let v = col.get(i);
	    return empty(v) ? "" : col.fmt ? col.fmt(v) : String(v);
	}));
	// numbers are right aligned and padded with hidden decimals to the most
	// decimals in their column, so the decimal points line up
	let decimals = s => s.includes(".") ? s.length - s.indexOf(".") - 1 : 0;
	let max_decimals = table_cols.map((col, c) => Math.max(0, ...cells.map(row => decimals(row[c]))));
	let body = document.createElement("tbody");
	for (let row of cells) {
	    let tr = body.insertRow();
	    table_cols.forEach((col, c) => {
		let td = tr.insertCell();
		td.textContent = row[c];
		if (col.fmt != format3) {
		    return;
		}
		td.className = "num";
		let pad = max_decimals[c] - decimals(row[c]);
		if (row[c] != "" && pad > 0) {
		    let span = document.createElement("span");
		    span.className = "pad";
		    span.textContent = (row[c].includes(".") ? "" : ".") + "0".repeat(pad);
		    td.appendChild(span);
		}
	    });
	}
	el("results_table").replaceChild(body, el("results_table").tBodies[0]);
	el("results_table_caption").textContent = total > table_max_rows ?
	    "First " + table_max_rows + " of " + total + " results" + (time_interval ? " in the picked interval" : "") :
	    total + " results" + (time_interval ? " in the picked interval" : "");
    }

    // the picked [from, to] time interval of the raw results, null for all
    // of them, zooming the raw, day or month charts picks it, and it is
    // kept when changing to another mode
    let time_interval = null;
    function in_time_interval(ts) {
	return time_interval == null || (ts >= time_interval[0] && ts <= time_interval[1]);
    }
    // the number of the only profile to show, null for all of them
    let only_profile = null;
    function result_shown(ts, i) {
	return in_time_interval(ts) && (only_profile == null || data[6][i] == only_profile);
    }
    // the x range the charts were last set to when the mode changed, it
    // doesn't change the picked interval
    let restored_x = null;
    function on_x_range(r) {
	if (profile_span() || no_data || d[0].length == 0) {
	    return;
	}
	if (restored_x && r[0] == restored_x[0] && r[1] == restored_x[1]) {
	    return;
	}
	if (r[0] <= d[0][0] && r[1] >= d[0][d[0].length - 1]) {
	    time_interval = null;
	}
	else {
	    time_interval = [r[0], raw_x_end(r[1])];
	}
	show_time_interval();
    }
    let interval_fmt = uPlot.fmtDate("{YYYY}-{MMM}-{D} {H}:{mm}");
    function show_time_interval() {
	let cnt = data[0].filter(result_shown).length;
	let text = cnt + " results";
	if (cnt > 0) {
	    let first = data[0].find(result_shown);
	    let last = data[0].findLast(result_shown);
	    text = interval_fmt(new Date(first * 1e3)) + " \u2013 " + interval_fmt(new Date(last * 1e3)) + ", " + text;
	}
	el("time_interval_text").textContent = (time_interval ? "" : "All: ") + text;
	el("time_interval_clear").style.display = time_interval ? "" : "none";
	show_results_table();
    }
    // the start of the day or month ts falls in
    function bucket_start(ts, mode) {
	let date = new Date(ts * 1e3);
	if (mode == "day") {
	    return new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime() / 1e3;
	}
	if (mode == "month") {
	    return new Date(date.getFullYear(), date.getMonth(), 1).getTime() / 1e3;
	}
	return ts;
    }

    let average_mode = "raw";
    try {
	average_mode = localStorage.getItem("average") || "raw";
    } catch (e) {}
    set_chart_data(average_mode);

    let aggregates = [];
    for (let i in d) {
	aggregates.push({ min: null, max: null, avg: null });
    }

    let aggregates2 = [];
    for (let i in d2) {
	aggregates2.push({ min: null, max: null, avg: null });
    }

    // the first profile is filled as a lone one is, the others are see through
    // over it, with a color each for download, upload and idle. There are more
    // profiles than clearly different colors, the rest are gray
    const profile_colors = [
	["#c98500", "#00968f", "#7a52c7"],
	["#c2358a", "#2f8fd0", "#5f8f1a"],
	["#9a57c9", "#d0603a", "#1f9fb0"],
    ];
    function profile_series(p, slot, label, fill, values) {
	let series = {
	    label: several ? profile_name(p + 1) + " " + label : label,
	    ...seriesOpts,
	    values: values,
	};
	if (p == 0) {
	    series.fill = fill;
	}
	else {
	    series.fill = (profile_colors[p - 1]?.[slot] ?? "#888888") + "66";
	}
	return series;
    }
    function all_profiles(series) {
	let ret = [{}];
	for (let p = 0; p < chart_profiles; p++) {
	    ret.push(...series(p));
	}
	return ret;
    }
    let speed_values = (u, sidx, idx) => get_values_for_legend(d, aggregates, sidx, idx, u, dist1);
    let latency_values = (u, sidx, idx) => get_values_for_legend(d2, aggregates2, sidx, idx, u, dist2);

    let opts = {
	title: "Speed (Bandwidth)",
	...getSize(),
	cursor: cursorOpts,
	drawOrder: ["series", "axes"],

	scales: {
	    x: {
		range: (u, min, max) => {
//		    debug("scales x min:" + min + " max:" + max);
		    let r = x_range(min, max);
		    u.x_view = r;
		    on_x_range(r);
		    for (let i = 1; i < d.length; i++) {
			aggregates[i] = get_aggregates_for_series(d, r[0], r[1], i);
		    }
		    for (let i = 1; i < d2.length; i++) {
			aggregates2[i] = get_aggregates_for_series(d2, r[0], r[1], i);
		    }
		    if (chart1) {
			chart1.setLegend();
		    }
		    if (chart2) {
			chart2.setLegend();
		    }
		    return r;
		}
	    },
	    y: {
		range: (u, min, max) => y_range(u, min, max, rd)
	    },
	},

	series: all_profiles(p => [
	    profile_series(p, 0, "Download (Mbps)", "rgba(255, 0, 0, 0.7)", speed_values),
	    profile_series(p, 1, "Upload (Mbps)", "rgba(0, 0, 255, 0.7)", speed_values),
	]),
	axes: axis,
	hooks: dist_hooks(() => dist1, rd),
    };
    dist1 = make_dist_chart(opts, "dist1");
    chart1 = new uPlot(opts, d, document.getElementById("chart1"));

    let opts2 = {
	title: "Ping (Latency)",
	...getSize(),
	cursor: cursorOpts,
	drawOrder: ["series", "axes"],
	scales: {
	    x: {
		range: (u, min, max) => {
		    u.x_view = x_range(min, max);
		    on_x_range(u.x_view);
		    return u.x_view;
		}
	    },
	    y: {
		range: (u, min, max) => y_range(u, min, max, rd2, latency_max_drop)
	    },
	},
	series: all_profiles(p => [
	    profile_series(p, 0, "Latency While Downloading (ms)", "rgba(255, 0, 0, 0.5)", latency_values),
	    profile_series(p, 1, "Latency While Uploading (ms)", "rgba(0, 0, 255, 0.5)", latency_values),
	    profile_series(p, 2, "Latency When Idle (ms)", "rgba(50, 150, 50, 1)", latency_values),
	]),
	axes: axis,
	hooks: dist_hooks(() => dist2, rd2),
    };
    dist2 = make_dist_chart(opts2, "dist2");
    chart2 = new uPlot(opts2, d2, document.getElementById("chart2"));

    for (let input of document.querySelectorAll("#average_selector input")) {
	input.checked = input.value == average_mode;
	input.addEventListener("change", () => {
	    average_mode = input.value;
	    try {
		localStorage.setItem("average", average_mode);
	    } catch (e) {}
	    apply_mode();
	});
    }
    el("time_interval_clear").addEventListener("click", () => {
	time_interval = null;
	apply_mode();
    });
    show_time_interval();

    // takes new results after a test, the charts keep their zoom unless
    // they show everything, then they show the new results too
    refreshData = function(new_data, new_info) {
	for (let k = 0; k < data.length; k++) {
	    data[k] = new_data[k];
	}
	info = new_info;
	no_data = data[0].length == 0;
	set_chart_data(average_mode);
	dist1.invalidate();
	dist2.invalidate();
	let span = profile_span();
	for (let [chart, cd] of [[chart1, d], [chart2, d2]]) {
	    let [min, max] = [chart.scales.x.min, chart.scales.x.max];
	    let zoomed = span ? !(min == 0 && max == span) : time_interval != null;
	    if (zoomed) {
		restored_x = [min, max];
		chart.setData(cd, false);
		chart.setScale("x", { min: min, max: max });
	    }
	    else {
		chart.setData(cd);
	    }
	}
	show_time_interval();
    };

    // refills the charts for the current mode, keeping the picked interval
    function apply_mode() {
	unlock_legend_widths();
	set_chart_data(average_mode);
	dist1.invalidate();
	dist2.invalidate();
	if (profile_span() || time_interval == null) {
	    restored_x = null;
	    chart1.setData(d);
	    chart2.setData(d2);
	}
	else {
	    restored_x = [bucket_start(time_interval[0], average_mode), time_interval[1]];
	    for (let [chart, cd] of [[chart1, d], [chart2, d2]]) {
		chart.setData(cd, false);
		chart.setScale("x", { min: restored_x[0], max: restored_x[1] });
	    }
	}
	show_time_interval();
    }

    // a click on a profile's name shows only its series and results, a second
    // click shows all of them
    onClickName = function(profile) {
	only_profile = only_profile == profile ? null : profile;
	for (let [chart, per_profile] of [[chart1, 2], [chart2, 3]]) {
	    chart.batch(() => {
		for (let s = 1; s < chart.series.length; s++) {
		    let number = Math.floor((s - 1) / per_profile) + 1;
		    chart.setSeries(s, { show: only_profile == null || number == only_profile });
		}
	    });
	}
	for (let i = 0; i < gauge_count; i++) {
	    gauge_el(i, "name").classList.toggle("dimmed", only_profile != null && i + 1 != only_profile);
	}
	show_time_interval();
    };

    window.addEventListener("resize", e => {
	chart1.setSize(getSize());
	chart2.setSize(getSize());
	for (let dist of [dist1, dist2]) {
	    dist.axes[0].ticks.size = isNarrow() ? 0 : 10;
	    dist.setSize(getDistSize());
	    dist.root.querySelector(".u-title").textContent = getDistTitle();
	}
    });

    request(null, onRequest);
}
window.onload = initSpeedKetchup;
    </script>
  </body>
