# SpeedKetchup settings, restart SpeedKetchup in the App Center after a change

# Port of the web page with the results
SPEEDKETCHUP_PORT=8288

# Minutes between the speed tests
SPEEDKETCHUP_INTERVAL=10

# Speedtest server host[:port] to always test against, empty picks the
# server with the lowest latency for every test
SPEEDKETCHUP_SERVER=

# Seconds to test the download and upload speed, 0 skips the test
SPEEDKETCHUP_DOWNLOAD_DURATION=10
SPEEDKETCHUP_UPLOAD_DURATION=10

# Parallel connections for the download and upload tests
SPEEDKETCHUP_DOWNLOAD_CONNECTIONS=8
SPEEDKETCHUP_UPLOAD_CONNECTIONS=8

# InfluxDB line protocol write url to also write every result to, http only,
# eg http://influxdb:8086/api/v2/write?org=home&bucket=speedketchup, and its
# token
SPEEDKETCHUP_INFLUX_URL=
SPEEDKETCHUP_INFLUX_TOKEN=

# MQTT broker host[:port] to also publish every result to, with Home Assistant
# discovery, plain mqtt only, and its user name and password
SPEEDKETCHUP_MQTT=
SPEEDKETCHUP_MQTT_USER=
SPEEDKETCHUP_MQTT_PASSWORD=

# Several test profiles, eg one for every wan: the interval, server, duration
# and connections settings above and the ones below take comma separated
# values, one for every profile, an empty one is the default, a single value is
# for all of them, eg SPEEDKETCHUP_NAME=wan1,wan2

# Names of the profiles
SPEEDKETCHUP_NAME=

# Network interface and source address to test over, and the dscp value 0-63
# of the test traffic for the router to pick a wan by
SPEEDKETCHUP_INTERFACE=
SPEEDKETCHUP_SRC_ADDR=
SPEEDKETCHUP_DSCP=

# Dns server addr[:port] for the lookups of the test, asked the way the test goes
SPEEDKETCHUP_DNS_SERVER=

# yes runs the tests of different profiles at the same time
SPEEDKETCHUP_ALLOW_OVERLAPPING_TESTS=no
